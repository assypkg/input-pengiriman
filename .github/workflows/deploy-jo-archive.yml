name: Deploy JO Archive Edge Function

on:
  workflow_dispatch:
  push:
    branches:
      - jo-closed-supabase-storage
      - superuser-account-management
      - main
    paths:
      - "supabase/functions/username-login/**"
      - "supabase/functions/archive-closed-deliveries/**"
      - "supabase/functions/admin-reset-user-password/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-jo-archive.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy username-login
        run: supabase functions deploy username-login --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy archive-closed-deliveries
        run: supabase functions deploy archive-closed-deliveries --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy admin-reset-user-password
        run: supabase functions deploy admin-reset-user-password --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt --yes
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Smoke test password reset rejects anonymous callers
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_UadEwYUBc9Whu3m7VKrF6g_lAjS_Y4U
        run: |
          status=$(curl -sS -o /tmp/password-reset-smoke.json -w "%{http_code}" \
            -X POST "https://wcsjjdzxnwhzqkqninky.supabase.co/functions/v1/admin-reset-user-password" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --data '{"username":"bayua"}')
          cat /tmp/password-reset-smoke.json
          test "$status" = "401"
      - name: Smoke test archive endpoint rejects unauthenticated requests
        env:
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_UadEwYUBc9Whu3m7VKrF6g_lAjS_Y4U
        run: |
          status=$(curl -sS -o /tmp/archive-smoke.json -w "%{http_code}" \
            -X POST "https://wcsjjdzxnwhzqkqninky.supabase.co/functions/v1/archive-closed-deliveries" \
            -H "Content-Type: application/json" \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            --data '{"action":"list"}')
          cat /tmp/archive-smoke.json
          test "$status" = "401"
