name: Validate JO H+1 and Supabase Archive

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, jo-closed-supabase-storage]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/username-login/index.ts
          deno check supabase/functions/archive-closed-deliveries/index.ts
          deno check supabase/functions/annual-shipment-archive/index.ts

      - name: Validate Admin Input HTML, JavaScript and archive contract
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Extractor(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.current = []
                  self.in_script = False
                  self.script_type = ""

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script":
                      self.in_script = True
                      self.current = []
                      self.script_type = attrs.get("type", "")

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append((self.script_type, "".join(self.current)))
                      self.in_script = False

          source = Path("index.html").read_text(encoding="utf-8")
          parser = Extractor()
          parser.feed(source)

          duplicates = sorted({item for item in parser.ids if parser.ids.count(item) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          modules = [code for kind, code in parser.scripts if kind == "module" and code.strip()]
          scripts = [code for kind, code in parser.scripts if kind != "module" and code.strip()]
          if not scripts:
              raise SystemExit("No inline application JavaScript found.")
          if modules:
              Path("/tmp/admin-input.mjs").write_text("\n;\n".join(modules), encoding="utf-8")
          Path("/tmp/admin-input.js").write_text("\n;\n".join(scripts), encoding="utf-8")

          required = [
              '"/functions/v1/username-login"',
              '"/functions/v1/archive-closed-deliveries"',
              'sessionStorage.setItem("assembly_admin_access_token"',
              "tanggalJakartaHariIni() > hPlusOne",
              "isEligibleForArchive(item)",
              'action: "archive"',
              "archiveCache.filter",
              'archiveStorage: "supabase"',
              "arsip-pengiriman",
              'id="annualArchivePanel"',
              'id="archiveMobileCards"',
              "archive-mobile-qty-grid",
              "archive-mobile-date-header",
              "formatHariDanTanggal(dateKey)",
              "archive-mobile-date-items",
              'id="mainDashboard"',
              'id="arsipJOModal" class="archive-page-view"',
              "Kembali ke Dashboard",
              "body.archive-page-active #mainDashboard",
              'window.tutupArsipJO = function()',
              'document.body.classList.add("archive-page-active")',
              "Pulihkan",
              "archive-mobile-meta",
              'id="archiveDataTabPane"',
              'id="annualArchiveTabPane"',
              'id="archiveDataTabBtn"',
              'id="archiveAnnualTabBtn"',
              "window.pilihTabArsipJO",
              'annualArchiveApi("admin-summary")',
              "function refreshAnnualAdminSession()",
              "/auth/v1/token?grant_type=refresh_token",
              "sessionStorage.setItem(\"assembly_admin_refresh_token\", session.refresh_token)",
              "response.status === 401",
              "Arsip JO CLOSED mulai 10 November 2026",
              "annual-coverage-note",
              "active-record-identity",
              "active-record-fg",
              "active-record-qty-grid",
              "active-record-status",
              "active-date-header",
              "card-footer-actions",
              "function nilaiSisaPengirimanAktif(item)",
              "nilaiSisaPengirimanAktif(item) <= 0",
              'id="detailTanggalCards"',
              "detail-date-cards",
              "active-record-jo, .active-record-fg",
              "archive-mobile-jo, .archive-mobile-code",
              "KEKURANGAN",
              "active-record-card.open .active-record-qty.result strong",
              "active-record-card.open .active-record-qty.remaining strong",
              "active-record-card.closed .active-record-qty.result strong",
              "active-record-card.closed .active-record-qty.remaining strong",
              "archive-mobile-qty.is-shortage strong",
              "hasil-closed",
              "kekurangan-open",
              "kekurangan-closed",

              "window.downloadAnnualBackup",
              "window.verifikasiBackupTahunan",
              "window.hapusCloudTahunan",
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing Admin Input marker: " + marker)

          if "passVal === 'admin'" in source or "passVal === 'admin'" in source:
              raise SystemExit("Legacy hardcoded Admin password is still present.")
          if 'archiveCache = database.filter' in source:
              raise SystemExit("Archive UI must read its records from Supabase, not Firestore.")
          print(f"HTML parsed; {len(parser.ids)} IDs; {len(scripts)} scripts.")
          print("Supabase login, H+1 client gate, and Supabase archive API markers passed.")
          PY
          node --check /tmp/admin-input.js
          if [ -f /tmp/admin-input.mjs ]; then node --check /tmp/admin-input.mjs; fi

      - name: Validate archive tab separation and lazy annual loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("index.html").read_text(encoding="utf-8")
          required = [
              'onclick="pilihTabArsipJO(\'data\')"',
              'onclick="pilihTabArsipJO(\'annual\')"',
              'if (isAnnual) loadAnnualArchiveSummary();',
              'window.pilihTabArsipJO("data");',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing archive tab marker: " + marker)
          open_fn = source[source.index("window.bukaArsipJO = async function()"):source.index("window.tutupArsipJO = function()")]
          if "loadAnnualArchiveSummary()" in open_fn:
              raise SystemExit("Annual summary must not load when the archive modal first opens.")
          if 'id="archiveDataTabPane"' not in source or 'id="annualArchiveTabPane"' not in source:
              raise SystemExit("Both archive tab panes are required.")
          annual_start = source.index('<section id="annualArchiveTabPane"')
          tabs_start = source.index('<nav class="archive-tabs"', annual_start)
          annual_region = source[annual_start:tabs_start]
          if annual_region.count("<section") != annual_region.count("</section>"):
              raise SystemExit("Annual recap pane is not closed before archive tabs; Data Arsip would be hidden.")
          if tabs_start < annual_start:
              raise SystemExit("Archive tabs must be siblings of the annual pane.")
          print("Data Arsip is the default tab; annual summary is lazy-loaded only on selection.")
          PY

      - name: Validate annual backup verification and cloud purge guardrails
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("supabase/functions/annual-shipment-archive/index.ts").read_text(encoding="utf-8")
          required = [
              'action === "admin-summary"',
              'action === "export"',
              'action === "verify"',
              'action === "purge"',
              'state: "VERIFIED"',
              'state: "PURGING"',
              'done ? "DELETED" : "PURGING"',
              "mergeDeletedAnnualSummaries",
              'status: "BACKED_UP"',
              'buildFinalSnapshot(context, year)',
              'confirmation !== year',
              'recordsSha256',
              'delivery_date_year',
          ]
          # Admin summary must recognize YYYY delivery-date years with one regex escape.
          if r'if (!/^\d{4}$/.test(rowYear)) continue;' not in source:
              raise SystemExit("Admin annual summary must use a single escaped digit-class pattern.")
          if r'if (!/^\\d{4}$/.test(rowYear)) continue;' in source:
              raise SystemExit("Admin annual summary contains a double-escaped year pattern.")
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing annual archive safety marker: " + marker)
          print("Annual export, cloud re-verification, explicit year confirmation and resumable purge guards passed.")
          PY

      - name: Validate private Storage and server-side H+1 enforcement
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path("supabase/functions/archive-closed-deliveries/index.ts").read_text(encoding="utf-8")
          required = [
              'const BUCKET = "arsip-pengiriman"',
              'public: false',
              '["admin", "superuser"]',
              'jakartaToday() <= hPlusOne',
              'record.docId !== id',
              'archiveState: "ARCHIVED"',
              'sourceCollection: "production_data_v2"',
              'action === "archive"',
              'action === "list"',
              'action === "restore"',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing Edge Function safety marker: " + marker)
          if 'public: true' in source:
              raise SystemExit("Archive bucket must never be public.")
          print("Private bucket, Supabase role validation, H+1 server gate and restore/list actions passed.")
          PY
