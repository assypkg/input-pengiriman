name: Deploy Assembly Edge Functions

on:
  workflow_dispatch:
  push:
    branches:
      - supabase-auth-foundation
    paths:
      - "supabase/functions/username-login/**"
      - "supabase/functions/provision-assembly-user/**"
      - "supabase/functions/token-manager-api/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-assembly-edge-functions.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref wcsjjdzxnwhzqkqninky
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Deploy username-login
        run: supabase functions deploy username-login --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy provision-assembly-user
        run: supabase functions deploy provision-assembly-user --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy token-manager-api
        run: supabase functions deploy token-manager-api --project-ref wcsjjdzxnwhzqkqninky --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
