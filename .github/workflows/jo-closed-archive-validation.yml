name: Admin Input Supabase Archive Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [jo-closed-supabase-storage]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Admin Input and Supabase archive integration
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = []
                  self.scripts = []
                  self.current = []
                  self.in_script = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if "id" in attrs:
                      self.ids.append(attrs["id"])
                  if tag == "script":
                      self.in_script = True
                      self.current = []

              def handle_data(self, data):
                  if self.in_script:
                      self.current.append(data)

              def handle_endtag(self, tag):
                  if tag == "script" and self.in_script:
                      self.scripts.append("".join(self.current))
                      self.in_script = False

          source = Path("index.html").read_text(encoding="utf-8")
          parser = Parser()
          parser.feed(source)
          duplicates = sorted({value for value in parser.ids if parser.ids.count(value) > 1})
          if duplicates:
              raise SystemExit("Duplicate HTML IDs: " + ", ".join(duplicates))
          if not parser.scripts:
              raise SystemExit("No inline application script.")
          Path("/tmp/admin-input.js").write_text("\n;\n".join(parser.scripts), encoding="utf-8")

          required = [
              '"/functions/v1/username-login"',
              '"/functions/v1/archive-closed-deliveries"',
              'sessionStorage.setItem("assembly_admin_access_token"',
              "tanggalJakartaHariIni() > hPlusOne",
              "isEligibleForArchive(item)",
              'action: "archive"',
              'action: "list"',
              'action: "restore"',
              "archiveCache.filter",
              'archiveStorage: "supabase"',
              "Supabase Storage / arsip-pengiriman",
              'doc(window.db, "production_data_v2", id)',
          ]
          for marker in required:
              if marker not in source:
                  raise SystemExit("Missing integration marker: " + marker)

          if "passVal === 'admin'" in source:
              raise SystemExit("Legacy hardcoded Admin password remains.")
          if 'archiveCache = database.filter' in source:
              raise SystemExit("Archive modal must load from Supabase, not Firestore.")
          start = source.index("// --- ARSIP JO CLOSED:")
          end = source.index("window.cetakPDF", start)
          archive_code = source[start:end]
          if "deleteDoc" in archive_code or "batch.delete" in archive_code:
              raise SystemExit("Archive feature must not delete the archived source record as part of copy.")
          if "window.cetakPDF" not in source:
              raise SystemExit("Existing Admin Input page functions were not retained.")
          print(f"HTML parsed; {len(parser.ids)} unique IDs; {len(parser.scripts)} scripts.")
          print("Supabase-authenticated archive UI, H+1 gate, and Firestore source marker checks passed.")
          PY
          node --check /tmp/admin-input.js
